name: PS5 voorraad-check

# Doorlopende controle: één run kijkt elke 30 seconden, ±5u40 lang, en start daarna
# zichzelf opnieuw. De cron hieronder is alleen een vangnet voor als die keten ooit breekt.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Stuur een testmelding naar je gsm"
        type: boolean
        default: true

# Er draait er altijd maar één tegelijk; nieuwe starts wachten in de rij (max. 1).
concurrency:
  group: ps5-check
  cancel-in-progress: false

permissions:
  contents: write  # om nieuw ontdekte producten te bewaren (bekende_producten.json)
  actions: write   # nodig om de volgende run te starten

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Controleer voorraad op playstation.com (doorlopend)
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          HC_PING_URL: ${{ secrets.HC_PING_URL || vars.HC_PING_URL }}
          LOOP_SECONDS: "20400"   # 5u40
          INTERVAL: "30"
          EINDDATUM: "2026-12-31" # daarna stopt de monitor vanzelf
          TEST_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: python3 monitor.py

      - name: Nieuw ontdekte producten bewaren
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- bekende_producten.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bekende_producten.json
            git commit -q -m "Nieuwe PS5-producten gezien"
            git pull -q --rebase origin main && git push -q origin HEAD:main \
              || echo "::warning::kon bekende_producten.json niet bewaren"
          fi

      - name: Volgende run starten
        if: always() && steps.check.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f test=false
