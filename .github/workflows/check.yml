name: PS5 voorraad-check

on:
  schedule:
    - cron: "*/5 * * * *"   # elke 5 minuten (GitHub kan soms een paar minuten later starten)
    - cron: "7 9 * * *"     # dagelijks ±10u Belgische tijd: 'monitor draait nog'-melding
  workflow_dispatch:
    inputs:
      test:
        description: "Stuur een testmelding naar je gsm"
        type: boolean
        default: true

concurrency:
  group: ps5-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Controleer voorraad op playstation.com
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          ROUNDS: "2"
          INTERVAL: "120"
          HEARTBEAT: ${{ github.event.schedule == '7 9 * * *' }}
          TEST_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: python3 monitor.py
